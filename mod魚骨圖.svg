<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1100" viewBox="0 0 680 550" role="img" font-family="'Microsoft JhengHei UI','Microsoft JhengHei','Noto Sans TC',sans-serif">
<title>Claude Code mod 魚骨圖</title>
<desc>以魚骨圖拆解 mod：上排是程式怎麼寫（檔案、事件、處理方式），下排是能做什麼與怎麼管（$ 能力、畫面位置、載入與安全），全部匯聚到魚頭「mod」。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="550" fill="#FFFFFF"/>
<line x1="40" y1="270" x2="536" y2="270" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<g stroke="#B4B2A9" stroke-width="1" fill="none">
<line x1="120" y1="140" x2="170" y2="268"/><line x1="300" y1="140" x2="350" y2="268"/><line x1="480" y1="140" x2="520" y2="268"/>
<line x1="120" y1="400" x2="170" y2="272"/><line x1="300" y1="400" x2="350" y2="272"/><line x1="480" y1="400" x2="520" y2="272"/>
</g>
<g text-anchor="middle" dominant-baseline="central">
<rect x="540" y="240" width="100" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="590" y="260" font-size="14" font-weight="500" fill="#2C2C2A">mod</text>
<text x="590" y="282" font-size="12" fill="#5F5E5A">跑在裡面的程式</text>

<rect x="40" y="40" width="160" height="100" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="120" y="60" font-size="14" font-weight="500" fill="#3C3489">① 檔案</text>
<text x="120" y="84" font-size="12" fill="#534AB7">plugin.json 名片</text>
<text x="120" y="104" font-size="12" fill="#534AB7">hooks.json 指路</text>
<text x="120" y="124" font-size="12" fill="#534AB7">register.ts 做事</text>

<rect x="220" y="40" width="160" height="100" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="300" y="60" font-size="14" font-weight="500" fill="#3C3489">② 事件</text>
<text x="300" y="84" font-size="12" fill="#534AB7">session.start 開場</text>
<text x="300" y="104" font-size="12" fill="#534AB7">prompt.submit 送出</text>
<text x="300" y="124" font-size="12" fill="#534AB7">tool.call · ui.render</text>

<rect x="400" y="40" width="160" height="100" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="480" y="60" font-size="14" font-weight="500" fill="#3C3489">③ 處理方式</text>
<text x="480" y="84" font-size="12" fill="#534AB7">觀察：next(e)</text>
<text x="480" y="104" font-size="12" fill="#534AB7">改寫：傳新的 e</text>
<text x="480" y="124" font-size="12" fill="#534AB7">接手：自己回傳</text>

<rect x="40" y="400" width="160" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="120" y="420" font-size="14" font-weight="500" fill="#085041">④ $ 能力</text>
<text x="120" y="444" font-size="12" fill="#0F6E56">$.ui · $.command</text>
<text x="120" y="464" font-size="12" fill="#0F6E56">$.model 呼叫模型</text>
<text x="120" y="484" font-size="12" fill="#0F6E56">$.fs · $.store 存取</text>

<rect x="220" y="400" width="160" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="300" y="420" font-size="14" font-weight="500" fill="#085041">⑤ 畫面位置</text>
<text x="300" y="444" font-size="12" fill="#0F6E56">加：輸入框上方</text>
<text x="300" y="464" font-size="12" fill="#0F6E56">加：旁邊面板</text>
<text x="300" y="484" font-size="12" fill="#0F6E56">改：工具列·提示·提問框</text>

<rect x="400" y="400" width="160" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="480" y="420" font-size="14" font-weight="500" fill="#085041">⑥ 載入與安全</text>
<text x="480" y="444" font-size="12" fill="#0F6E56">市集 · 設定檔登記</text>
<text x="480" y="464" font-size="12" fill="#0F6E56">沒有沙盒</text>
<text x="480" y="484" font-size="12" fill="#0F6E56">先 validate 再裝</text>

<text x="340" y="530" font-size="12" fill="#5F5E5A">上排紫色：程式怎麼寫　下排青色：能做什麼、怎麼管</text>
</g>
</svg>
